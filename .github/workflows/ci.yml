name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs when a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Install dependencies once and cache for other jobs
  setup:
    name: Setup & Cache Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.6
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/@ia-next/*/node_modules
          key: ${{ runner.os }}-node20-pnpm8.15.6-modules-v2-${{ hashFiles('**/pnpm-lock.yaml', '**/schema.prisma') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @ia-next/database run build

  # Linting
  lint:
    name: Lint Code
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.6

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/@ia-next/*/node_modules
          key: ${{ runner.os }}-node20-pnpm8.15.6-modules-v2-${{ hashFiles('**/pnpm-lock.yaml', '**/schema.prisma') }}

      - name: Verify frozen dependency installation
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint
        continue-on-error: false

  # TypeScript type checking
  typecheck:
    name: TypeScript Type Check
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.6

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/@ia-next/*/node_modules
          key: ${{ runner.os }}-node20-pnpm8.15.6-modules-v2-${{ hashFiles('**/pnpm-lock.yaml', '**/schema.prisma') }}

      - name: Verify frozen dependency installation
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @ia-next/database run build

      - name: Run TypeScript
        run: pnpm typecheck

  # Run tests
  test:
    name: Run Tests
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.6

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/@ia-next/*/node_modules
          key: ${{ runner.os }}-node20-pnpm8.15.6-modules-v2-${{ hashFiles('**/pnpm-lock.yaml', '**/schema.prisma') }}

      - name: Install dependencies (test job safety)
        run: pnpm install --frozen-lockfile

      - name: Run API security tests
        run: pnpm --filter @ia-next/api test
        env:
          NODE_ENV: test

      - name: Run tests with coverage
        # Record versions as an annotation so CI-only transformer failures are diagnosable.
        run: |
          pnpm --filter web exec node -e "console.log('::notice title=Test toolchain::Node ' + process.version + '; Vitest ' + require('vitest/package.json').version + '; Vite ' + require('vite/package.json').version + '; React ' + require('react/package.json').version)"
          pnpm --filter web run test -- --coverage --reporter=json --reporter=default
        env:
          NODE_ENV: test

      - name: Check coverage threshold (60%)
        # ING-002: antes, si no existia coverage-summary.json (el reporter `json-summary` no estaba
        # configurado) el paso decia "skipping" y pasaba en verde sin medir nada. Ahora falla si no
        # hay informe o si falta una metrica. Medido el 28-nov-2026: lineas 72.4, ramas 64.6, funciones 73.6.
        run: |
          node -e "
          const fs = require('fs');
          const p = 'apps/web/coverage/coverage-summary.json';
          if (!fs.existsSync(p)) {
            console.error('No existe ' + p + ': la prueba con cobertura no genero el informe. La puerta no puede dar verde sin medir.');
            process.exit(1);
          }
          const total = JSON.parse(fs.readFileSync(p, 'utf-8')).total;
          const THRESHOLD = 60;
          let failed = false;
          for (const k of ['lines', 'branches', 'functions']) {
            const pct = total?.[k]?.pct;
            if (typeof pct !== 'number') { console.error('Falta la metrica ' + k + ' en ' + p); failed = true; continue; }
            console.log('Coverage ' + k + ': ' + pct + '%');
            if (pct < THRESHOLD) { console.error(k + ' por debajo de ' + THRESHOLD + '% (constitution 4.1)'); failed = true; }
          }
          if (failed) process.exit(1);
          console.log('Coverage OK (threshold: ' + THRESHOLD + '%)');
          "

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          flags: unittests
          fail_ci_if_error: false

  # Build the application
  build:
    name: Build Application
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.6

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/@ia-next/*/node_modules
          key: ${{ runner.os }}-node20-pnpm8.15.6-modules-v2-${{ hashFiles('**/pnpm-lock.yaml', '**/schema.prisma') }}

      - name: Verify frozen dependency installation
        run: pnpm install --frozen-lockfile

      - name: Setup environment variables
        run: |
          echo "SKIP_ENV_VALIDATION=1" >> $GITHUB_ENV
          echo "NODE_ENV=production" >> $GITHUB_ENV
          echo "DATABASE_URL=postgresql://user:pass@localhost:5432/test" >> $GITHUB_ENV
          echo "NEXTAUTH_URL=http://localhost:3000" >> $GITHUB_ENV
          echo "NEXTAUTH_SECRET=ci-dummy-secret-for-build-only" >> $GITHUB_ENV
          echo "UPSTASH_REDIS_REST_URL=https://dummy-upstash.upstash.io" >> $GITHUB_ENV
          echo "UPSTASH_REDIS_REST_TOKEN=ci-dummy-token" >> $GITHUB_ENV

      - name: Build all packages
        run: pnpm build

      - name: Check build output
        run: |
          echo "Build completed successfully"
          ls -la apps/web/.next || echo "web build missing"
          ls -la apps/api/.next || echo "api build missing"

      # OPS-003: puerta de presupuesto de JS inicial por pagina (constitucion 5.1). BLOQUEANTE:
      # techo de 250 KB por pagina y linea base + 8 KB (.specify/bundle-budget.json). Levanta
      # `next start` sobre el build de arriba (mismas variables de entorno), mide, y falla cerrado
      # si el servidor no arranca o una ruta no responde. La tabla sale en el resumen del job.
      - name: Bundle budget (JS inicial por pagina)
        run: node .specify/scripts/bundle-size.mjs --serve

  # Security audit
  security:
    name: Security Audit
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.6

      - name: Run pnpm audit
        run: pnpm audit --audit-level moderate

  # Summary
  ci-success:
    name: CI Success
    needs: [lint, typecheck, test, build, security]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: All checks passed
        run: echo "✅ All CI checks passed successfully!"
