name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs when a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Install dependencies once and cache for other jobs
  setup:
    name: Setup & Cache Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            **/.turbo
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

  # Linting
  lint:
    name: Lint Code
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Ensure ESLint v8 is installed (workspace root)
        run: pnpm -w add -D eslint@8.57.1

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            **/.turbo
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Run ESLint
        run: pnpm lint
        continue-on-error: false

      - name: Verify contracts sync (docs → apps/web)
        run: node .specify/scripts/sync-contracts.mjs --check

  # TypeScript type checking
  typecheck:
    name: TypeScript Type Check
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            **/.turbo
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Run TypeScript
        run: pnpm typecheck

  # Run tests
  test:
    name: Run Tests
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            **/.turbo
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies (test job safety)
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm test -- --coverage --reporter=json --reporter=default
        env:
          NODE_ENV: test

      - name: Check coverage threshold (60%)
        run: |
          node -e "
          const fs = require('fs');
          const paths = [
            'coverage/coverage-summary.json',
            'apps/web/coverage/coverage-summary.json',
            'apps/api/coverage/coverage-summary.json',
          ];
          let found = false;
          for (const p of paths) {
            if (!fs.existsSync(p)) continue;
            found = true;
            const summary = JSON.parse(fs.readFileSync(p, 'utf-8'));
            const total = summary.total;
            const lines = total?.lines?.pct ?? 100;
            const branches = total?.branches?.pct ?? 100;
            const functions = total?.functions?.pct ?? 100;
            console.log('Coverage — lines:', lines + '%', '| branches:', branches + '%', '| functions:', functions + '%');
            const THRESHOLD = 60;
            if (lines < THRESHOLD || branches < THRESHOLD || functions < THRESHOLD) {
              console.error('Coverage below ' + THRESHOLD + '% threshold (constitution §4.1)');
              process.exit(1);
            }
            console.log('Coverage OK (threshold: ' + THRESHOLD + '%)');
          }
          if (!found) console.log('No coverage report found — skipping threshold check');
          "

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          flags: unittests
          fail_ci_if_error: false

  # Build the application
  build:
    name: Build Application
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            **/.turbo
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Setup environment variables
        run: |
          echo "SKIP_ENV_VALIDATION=1" >> $GITHUB_ENV
          echo "NODE_ENV=production" >> $GITHUB_ENV
          echo "DATABASE_URL=postgresql://user:pass@localhost:5432/test" >> $GITHUB_ENV
          echo "NEXTAUTH_URL=http://localhost:3000" >> $GITHUB_ENV
          echo "NEXTAUTH_SECRET=ci-dummy-secret-for-build-only" >> $GITHUB_ENV
          echo "UPSTASH_REDIS_REST_URL=https://dummy-upstash.upstash.io" >> $GITHUB_ENV
          echo "UPSTASH_REDIS_REST_TOKEN=ci-dummy-token" >> $GITHUB_ENV

      - name: Build all packages
        run: pnpm build

      - name: Check build output
        run: |
          echo "Build completed successfully"
          ls -la apps/web/.next || echo "web build missing"
          ls -la apps/api/.next || echo "api build missing"

  # Security audit
  security:
    name: Security Audit
    needs: setup
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Run pnpm audit
        run: pnpm audit --audit-level moderate
        continue-on-error: true

  # Summary
  ci-success:
    name: CI Success
    needs: [lint, typecheck, test, build]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: All checks passed
        run: echo "✅ All CI checks passed successfully!"
